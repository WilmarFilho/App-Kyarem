name: kyarem_eventos_publico
description: "Área publica de Campeonatos."
publish_to: 'none'

version: 1.0.0+4 

environment:
  sdk: '>=3.10.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- COMUNICAÇÃO ---
  http: ^1.1.0
  supabase_flutter: ^2.12.0
  flutter_dotenv: ^5.2.1

  intl: ^0.20.2
  dio: ^5.7.0
  shared_preferences: ^2.3.2

  # --- INTERFACE E UTILITÁRIOS ---
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.2
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  image_picker: ^1.0.7
  google_fonts: ^8.0.2
  flutter_native_splash: ^2.4.0
  balanced_text: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"

# Configuração do Ícone (Fora do dev_dependencies)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png" 
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter_native_splash:
  color: "#260404" # Cor de fundo sólida (sem ícone/círculo)
  image: assets/images/transparent.png # Se tiver um PNG transparente
  fullscreen: true
  android_12:
    color: "#260404"
    image: assets/images/transparent.png # Se tiver um PNG transparente
    icon_background_color: "#260404" # Garante que o fundo do ícone seja idêntico

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/envelope.svg
    - assets/images/key.svg
    - assets/images/meteor.svg
    - assets/images/icon.png 
    - assets/images/splash.png 

  fonts:
    - family: Bebas Neue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
