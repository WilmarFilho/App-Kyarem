spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: false

  sql:
    init:
      mode: always

server:
  port: 8080

security:
  jwt:
    issuer: https://fake-issuer.example.com

supabase:
  url: https://fake.supabase.co
  key: fake-service-role-key
  bucket:
    sumulas: test-bucket

logging:
  level:
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    com.nkw: WARN
