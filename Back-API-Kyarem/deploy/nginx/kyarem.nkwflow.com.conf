# /etc/nginx/sites-available/kyarem.nkwflow.com
# Copiar para: /etc/nginx/sites-available/kyarem.nkwflow.com
# Ativar com: sudo ln -s /etc/nginx/sites-available/kyarem.nkwflow.com /etc/nginx/sites-enabled/
# Certificado: sudo certbot --nginx -d kyarem.nkwflow.com

# ──────────────────────────────────────────────────────────────────────────────
# Redirect HTTP → HTTPS
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name kyarem.nkwflow.com;

    return 301 https://$host$request_uri;
}

# ──────────────────────────────────────────────────────────────────────────────
# HTTPS — Roteamento principal
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kyarem.nkwflow.com;

    # Certificado gerenciado pelo certbot (preenchido automaticamente)
    ssl_certificate     /etc/letsencrypt/live/kyarem.nkwflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kyarem.nkwflow.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Segurança
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header Referrer-Policy         "no-referrer-when-downgrade" always;

    client_max_body_size 25m;

    access_log /var/log/nginx/kyarem_access.log;
    error_log  /var/log/nginx/kyarem_error.log warn;

    # ──────────────────────────────────────────────────────────────────────────
    # /events/** → realtime-gateway (SSE)
    # DEVE vir ANTES do location / para ter prioridade
    # ──────────────────────────────────────────────────────────────────────────
    location /events/ {
        proxy_pass         http://127.0.0.1:8084;
        proxy_http_version 1.1;

        # SSE requer que nginx não faça buffer — dados devem fluir imediatamente
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;   # 1h — conexões SSE são longas
        proxy_send_timeout 3600s;

        # Headers obrigatórios para SSE funcionar corretamente
        proxy_set_header Connection        '';
        proxy_set_header Cache-Control     'no-cache';
        proxy_set_header X-Accel-Buffering 'no';

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS para apps públicos (ajustar se necessário)
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # ──────────────────────────────────────────────────────────────────────────
    # /** → api-core (REST API principal)
    # ──────────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8083;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
