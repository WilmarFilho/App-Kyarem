spring:
  application:
    name: kyarem-outbox-publisher

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: none        # Nunca altera schema — apenas lê/atualiza outbox_events
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/kyarem}
    connection-timeout: 10000

  flyway:
    enabled: false          # Migração gerenciada pelo api-core

# Configuração do poll da outbox
outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
  retry-interval-ms: ${OUTBOX_RETRY_INTERVAL_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: ${APP_PORT:8085}

logging:
  level:
    com.kyarem.outbox: ${LOG_LEVEL:INFO}
