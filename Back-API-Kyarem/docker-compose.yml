# docker-compose.yml — Kyarem (Back-API-Kyarem)
# Todos os containers usam prefixo back-api-kyarem e comunicação interna.
# O nginx da VPS (externo ao Docker) acessa api-core e realtime-gateway via localhost.

name: back-api-kyarem

networks:
  back-api-kyarem-network:
    driver: bridge

volumes:
  back-api-kyarem-rabbitmq-data:

services:

  # ──────────────────────────────────────────────────────────────────────────
  # RabbitMQ — Broker de eventos interno
  # Não expõe porta pública. Acesso via SSH tunnel para debug.
  # Management UI: ssh -L 15672:localhost:15672 user@vps → http://localhost:15672
  # ──────────────────────────────────────────────────────────────────────────
  back-api-kyarem-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: back-api-kyarem-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    expose:
      - "5672"
      - "15672"
    volumes:
      - back-api-kyarem-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - back-api-kyarem-network

  # ──────────────────────────────────────────────────────────────────────────
  # api-core — Backend principal
  # Expõe 127.0.0.1:8083 para o nginx da VPS
  # ──────────────────────────────────────────────────────────────────────────
  back-api-kyarem-api-core:
    image: ghcr.io/${GITHUB_REPOSITORY}/api-core:${IMAGE_TAG:-latest}
    container_name: back-api-kyarem-api-core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_RABBITMQ_HOST: back-api-kyarem-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST}
    ports:
      - "127.0.0.1:8083:8080"   # apenas localhost → nginx da VPS
    networks:
      - back-api-kyarem-network
    depends_on:
      back-api-kyarem-rabbitmq:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────────────────
  # outbox-publisher — Poll na outbox e publica no RabbitMQ
  # Sem porta exposta — worker puro
  # ──────────────────────────────────────────────────────────────────────────
  back-api-kyarem-outbox-publisher:
    image: ghcr.io/${GITHUB_REPOSITORY}/outbox-publisher:${IMAGE_TAG:-latest}
    container_name: back-api-kyarem-outbox-publisher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: back-api-kyarem-rabbitmq
      RABBITMQ_PORT: 5672
    networks:
      - back-api-kyarem-network
    depends_on:
      back-api-kyarem-rabbitmq:
        condition: service_healthy
      back-api-kyarem-api-core:
        condition: service_started

  # ──────────────────────────────────────────────────────────────────────────
  # projection-worker — Atualiza schema public com read models
  # Sem porta exposta — worker puro
  # ──────────────────────────────────────────────────────────────────────────
  back-api-kyarem-projection-worker:
    image: ghcr.io/${GITHUB_REPOSITORY}/projection-worker:${IMAGE_TAG:-latest}
    container_name: back-api-kyarem-projection-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: back-api-kyarem-rabbitmq
      RABBITMQ_PORT: 5672
    networks:
      - back-api-kyarem-network
    depends_on:
      back-api-kyarem-rabbitmq:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────────────────
  # metrics-worker — Recalcula classificações e rankings
  # Sem porta exposta — worker puro
  # ──────────────────────────────────────────────────────────────────────────
  back-api-kyarem-metrics-worker:
    image: ghcr.io/${GITHUB_REPOSITORY}/metrics-worker:${IMAGE_TAG:-latest}
    container_name: back-api-kyarem-metrics-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_HOST: back-api-kyarem-rabbitmq
      RABBITMQ_PORT: 5672
    networks:
      - back-api-kyarem-network
    depends_on:
      back-api-kyarem-rabbitmq:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────────────────
  # realtime-gateway — SSE para apps públicos
  # Expõe 127.0.0.1:8084 para o nginx da VPS
  # ──────────────────────────────────────────────────────────────────────────
  back-api-kyarem-realtime-gateway:
    image: ghcr.io/${GITHUB_REPOSITORY}/realtime-gateway:${IMAGE_TAG:-latest}
    container_name: back-api-kyarem-realtime-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: 9000
      RABBITMQ_HOST: back-api-kyarem-rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "127.0.0.1:8084:9000"   # apenas localhost → nginx da VPS
    networks:
      - back-api-kyarem-network
    depends_on:
      back-api-kyarem-rabbitmq:
        condition: service_healthy
